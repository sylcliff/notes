baseURL = "https://notes-6kd.pages.dev/"
defaultContentLanguage = "zh"
title = "我的技术笔记"
theme = "PaperMod"

[pagination]
  pagerSize = 10

# Hugo v0.158+ 推荐的新多语言配置(替代 languageCode)
[languages.zh]
  languageName = "中文"
  weight = 1
  contentDir = "content"

[params]
  env = "production"
  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  disableSpecial1stPost = true
  hideFooter = false
  ShowSearchButton = true
  defaultTheme = "auto"

# Keep $...$ and $$...$$ as raw text so KaTeX (injected via extend_head/footer) can render them.
[markup.goldmark.extensions.passthrough]
  enable = true
[markup.goldmark.extensions.passthrough.delimiters]
  block = [["$$", "$$"]]
  inline = [["$", "$"]]

[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "笔记"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "标签"
    url = "/tags/"
    weight = 3
